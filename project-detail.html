        .project-detail-content table th {
            background-color: #f0f0f0;

        }
        
        .project-detail-content code {

            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d63384;
        }
        
        .project-detail-content pre {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            overflow-x: auto;
            margin: 15px 0;
        }
        
        .project-detail-content pre code {
            color: #333;
            background-color: transparent;
            padding: 0;
        }
        
        .project-detail-content blockquote {

            padding-left: 15px;

    <script src="js/projects-gallery.js"></script>
    
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            
            if (!projectId) {
                $('#project-content').html(
                    '<div class="error-message">No project ID provided. <a href="gallery.html">Return to gallery</a></div>'
                );
                return;
            }
            
            if (!window.projectsData) {
                $('#project-content').html(
                    '<div class="error-message">Projects data not available. <a href="gallery.html">Return to gallery</a></div>'
                );
                return;
            }
            
            const project = window.projectsData.find(p => p.id === projectId);
            
            if (!project) {
                $('#project-content').html(
                    '<div class="error-message">Project not found. <a href="gallery.html">Return to gallery</a></div>'
                );
                return;
            }
            
            // Set page title
            document.title = project.title + ' - NCSU SOFTMAX';
            $('#project-title').text(project.title);
            
            // Fetch markdown file and render
            if (project.markdownFile) {
                $.get(project.markdownFile)
                    .done(function(markdownText) {
                        try {
                            var htmlContent = marked.parse(markdownText);
                            $('#project-content').html(htmlContent);
                            $('#project-content').find('a').attr('target', '_blank').attr('rel', 'noopener noreferrer');
                        } catch (error) {
                            console.error('Error parsing markdown:', error);
                            $('#project-content').html(
                                '<div class="error-message">Error parsing project details. ' + error.message + '</div>'
                            );
                        }
                    })
                    .fail(function() {
                        $('#project-content').html(
                            '<div class="error-message">Could not load project details. <a href="gallery.html">Return to gallery</a></div>'
                        );
                    });
            } else {
                $('#project-content').html(
                    '<div class="error-message">Project content not available. <a href="gallery.html">Return to gallery</a></div>'
                );
            }
        });
    </script>
